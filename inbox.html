<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>

  <style>
    /* Resets the page margins so the video goes exactly to the edges */
    body {
      margin: 0;
      padding: 0;
    }

    #intro-overlay {
      position: fixed;       
      top: 0;
      left: 0;
      width: 100%;           
      height: 100vh;         
      background-color: #000000; /* Change to match your video's background */
      display: flex;         
      justify-content: center;
      align-items: center;
      z-index: 9999;         
    }

    #intro-video {
      max-width: 100%;
      max-height: 100%;
    }
  </style>
</head>

<body>

  <div id="intro-overlay">
    <video id="intro-video" autoplay muted playsinline>
      <source src="your-animation.mp4" type="video/mp4">
    </video>
  </div>

  <div id="main-website" style="display: none;">
   
    </div>

  <script>
    window.addEventListener('load', function() {
      
      const introVideo = document.getElementById('intro-video');
      const overlay = document.getElementById('intro-overlay');
      const mainSite = document.getElementById('main-website');
      
      // Function to hide the video and show the site
      function revealWebsite() {
        overlay.style.display = 'none';
        mainSite.style.display = 'block';
      }

      // Plan A: Listen for the exact moment the video finishes
      introVideo.addEventListener('ended', revealWebsite);
      
      // Plan B: The Fallback Timer (e.g., 5000 = 5 seconds)
      // Change 5000 to be just a little bit longer than your actual video length
      setTimeout(revealWebsite, 5000); 
      
    });
  </script>

</body>
</html>
